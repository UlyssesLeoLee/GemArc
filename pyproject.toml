[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemarc-mcp"
version = "0.1.0"
description = "GemArc 5D architecture design scaffolding MCP server (MVP)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3.0"]
license = {text = "MIT"}

[project.scripts]
gemarc = "gemarc_mcp.cli:main"
gemarc-mcp = "gemarc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemarc_mcp = ["web/*", "registry.json"]
