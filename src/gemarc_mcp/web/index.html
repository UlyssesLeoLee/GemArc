<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GemArc · 多媒体架构文档</title>
  <link rel="stylesheet" href="./style.css">
  <!--
    The semantic-axis scene is drawn by the Three.js renderer that travels
    with the site. The runtime has no hard dependency on the library: when
    the import map cannot be reached, the page says so instead of pretending.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.180.0"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="gem">◆</span><span>GemArc</span><small>多媒体架构文档</small></div>
    <div class="top-actions">
      <button id="focus-toggle" class="action" type="button" aria-pressed="false"
              title="收起两侧窗格，把主内容区放大到整个窗口">专注</button>
      <div id="evidence" class="tag">正在载入</div>
    </div>
  </header>
  <main>
    <aside class="sidebar">
      <p class="section-title">维度 / DIMENSIONS</p>
      <nav id="nav">
        <button data-tab="1d" class="active"><span>01</span> 1D 文字 / Facts</button>
        <button data-tab="2d"><span>02</span> 2D 图论 / Graph</button>
        <button data-tab="3d"><span>03</span> 3D 语义与空间 / Space</button>
        <button data-tab="4d"><span>04</span> 4D 动态 / Time</button>
        <button data-tab="5d"><span>05</span> 5D 因果 / Causality</button>
        <button data-tab="workflow"><span>06</span> 工作流 / WBS + Execution</button>
        <button data-tab="prototype"><span>UI</span> 多标签页原型</button>
      </nav>
      <div class="side-foot">统一实体 ID · 固定组件外观<br>注：GemArc 的 D 为表达层级</div>
    </aside>
    <div class="splitter" data-pane="sidebar" data-label="调整侧栏宽度" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整侧栏宽度"></div>
    <section class="mainpane">
      <div class="heading"><div><div id="kicker" class="kicker">ARCHITECTURE MODEL</div><h1 id="headline">多媒体架构文档</h1></div><div id="view-actions"></div></div>
      <div id="content"></div>
    </section>
    <div class="splitter" data-pane="inspector" data-label="调整检查器宽度" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整检查器宽度"></div>
    <aside class="inspector">
      <p class="section-title">INSPECTOR / 证据详情</p>
      <div id="detail">选择节点查看关联信息</div>
      <div class="side-foot">界面仅展示模型数据；未经核实的项目事实不得视为真实证据。</div>
    </aside>
  </main>
  <footer id="footer">GemArc · Static Viewer MVP · 标准组件驱动</footer>
  <script src="./app.js" defer></script>
</body>
</html>
