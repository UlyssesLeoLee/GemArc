<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gate fixture: header-unmarked</title>
<!--ATLAS_SELFTEST-->
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; background: #fff; color: #123; }
  header { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #ccc; }
  header button { width: 84px; height: 30px; }
  main { padding: 8px; }
  .bar { position: relative; height: 44px; border-bottom: 1px solid #ccc; }
  .bar button { position: absolute; top: 6px; left: 8px; width: 84px; height: 30px; }
</style>
</head>
<body>
<div class="bar"><button type="button">One</button><button type="button">Two</button></div>
<main><p>Two controls sit on top of each other, but nothing is marked as the header.</p></main>
<script>
(function () {
  "use strict";
  var frame = 0;
  AtlasGate.run({
    tabs: ["main"],
    renderOnce: function () { frame += 1; return { frame: frame }; },
    frame: function () { return frame; }
  });
})();
</script>
</body>
</html>
