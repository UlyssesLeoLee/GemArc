<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gate fixture: ok-stub</title>
<!--ATLAS_SELFTEST-->
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; background: #fff; color: #123; }
  header { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #ccc; }
  header button { width: 84px; height: 30px; }
  main { padding: 8px; }
  canvas { display: block; width: 320px; height: 200px; border: 1px solid #999; }
  .fit { width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
</style>
</head>
<body data-tab="overview">
<header data-gate="header">
  <button type="button">Overview</button>
  <button type="button">Detail</button>
  <button type="button">Search</button>
  <button type="button">Export</button>
  <button type="button">Help</button>
  <button type="button">Settings</button>
</header>
<main>
  <canvas id="scene" width="320" height="200"></canvas>
  <p class="fit" data-gate="fit">Triangle drawn via raw WebGL</p>
  <p id="status">WebGL(software)</p>
</main>
<script>
(function () {
  "use strict";
  // Synthetic stub: one raw-WebGL triangle per tab, read back with readPixels in the SAME task.
  var canvas = document.getElementById("scene");
  var gl = canvas.getContext("webgl", { antialias: false });
  var frame = 0;
  var BG = [13, 27, 42];
  var COLORS = { overview: [1, 0.2, 0.1, 1], detail: [0.1, 0.9, 0.3, 1] };
  var program = null;
  var colorLoc = null;

  function compile(type, source) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error("shader: " + gl.getShaderInfoLog(shader));
    return shader;
  }

  function setup() {
    program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, "precision mediump float; uniform vec4 c; void main(){ gl_FragColor = c; }"));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(program));
    gl.useProgram(program);
    var buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, 0.0, 0.5]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(program, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    colorLoc = gl.getUniformLocation(program, "c");
  }

  function setTab(tab) {
    document.body.setAttribute("data-tab", tab);
  }

  function renderOnce(tab) {
    frame += 1;
    if (!gl) return { nonBgRatio: 0, renderer: "", status: "DEGRADED" };
    if (!program) setup();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(BG[0] / 255, BG[1] / 255, BG[2] / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    var c = COLORS[tab] || COLORS.overview;
    gl.uniform4f(colorLoc, c[0], c[1], c[2], c[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    var stats = AtlasGate.pixelStats(gl, BG); // same task as the draw: no preserveDrawingBuffer needed
    return { nonBgRatio: stats.nonBgRatio, nonBg: stats.nonBg, total: stats.total, renderer: AtlasGate.glRenderer(gl), status: "WebGL(software)" };
  }

  renderOnce("overview");
  AtlasGate.run({
    tabs: ["overview", "detail"],
    setTab: setTab,
    tabState: function () { return document.body.getAttribute("data-tab"); },
    renderOnce: renderOnce,
    frame: function () { return frame; },
    steps: [
      { name: "select-detail", run: function () { setTab("detail"); return document.body.getAttribute("data-tab") === "detail"; } }
    ]
  });
})();
</script>
</body>
</html>
