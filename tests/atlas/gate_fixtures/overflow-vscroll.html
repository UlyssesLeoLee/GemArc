<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gate fixture: overflow-vscroll</title>
<!--ATLAS_SELFTEST-->
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; background: #fff; color: #123; }
  header { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #ccc; }
  header button { width: 84px; height: 30px; }
  main { padding: 8px; }
  .tall { height: 2400px; }
  .wide { width: 100vw; height: 10px; background: #ddd; }
</style>
</head>
<body>
<header data-gate="header">
  <button type="button">One</button>
  <button type="button">Two</button>
</header>
<main><p>Tall page (vertical scrollbar) with one block that is 100vw wide.</p></main>
<div class="tall"></div>
<div class="wide"></div>
<script>
(function () {
  "use strict";
  var frame = 0;
  AtlasGate.run({
    tabs: ["main"],
    renderOnce: function () { frame += 1; return { frame: frame }; },
    frame: function () { return frame; }
  });
})();
</script>
</body>
</html>
