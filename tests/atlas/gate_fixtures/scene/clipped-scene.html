<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gate fixture: clipped-scene</title>
<!--ATLAS_SELFTEST-->
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; background: #fff; color: #123; }
  header { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #ccc; }
  header button { width: 84px; height: 30px; }
  main { padding: 8px; }
  canvas { display: block; width: 320px; height: 200px; border: 1px solid #999; }
</style>
</head>
<body>
<!--
  A 3D scene whose camera clamp cuts a building frame: the left and top edges of the frame lie outside the canvas. The nodes are inside, so
  node bounds alone would pass this page; the gate must FAIL it on the projected frame bounds (FRAME_CLIPPED, design 9.3).
-->
<header data-gate="header">
  <button type="button">One</button>
  <button type="button">Two</button>
</header>
<main><canvas id="scene" width="320" height="200" data-gate="canvas"></canvas></main>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var frame = 0;
  var scene = { frames: [{ id: "building", x: -60, y: -40, w: 300, h: 190 }], nodes: [{ id: "n1", x: 40, y: 50 }, { id: "n2", x: 120, y: 90 }] };
  function renderOnce() {
    frame += 1;
    ctx.fillStyle = "#0d1b2a";
    ctx.fillRect(0, 0, 320, 200);
    ctx.strokeStyle = "#ffcc33";
    scene.frames.forEach(function (f) { ctx.strokeRect(f.x, f.y, f.w, f.h); });
    ctx.fillStyle = "#ff6633";
    scene.nodes.forEach(function (n) { ctx.fillRect(n.x, n.y, 16, 16); });
    return { frame: frame };
  }
  renderOnce();
  AtlasGate.run({
    tabs: ["main"],
    renderOnce: renderOnce,
    frame: function () { return frame; },
    sceneBounds: function () { return scene; }
  });
})();
</script>
</body>
</html>
